<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-page">
        <div class="login-left">
            
            <img src="./images/images/ChatGPT Image Sep 4, 2026, 08_13_30 AM.png" class="login-logo" alt="">
            
            <h2 style="text-align: center;">Faith. Style. Always</h2>
            
            <img src="./images/images/ChatGPT Image Sep 22, 2026, 10_31_21 AM.png" class="login-image" alt="">
            
        </div>
        <div class="login-right">
            <div class="login-card">
                <h1>Welcome Back</h1>
                <p>Log in to your account</p>
                <form>
                    <div class="input-group">
                        <input type="email" placeholder="Email address" id="">
                    </div>
                    <div class="input-group">
                        <input type="password" placeholder="Password" >
                    </div>
                    <button type="submit" class="login-button">Log in</button>
                </form>
                <div class="signup">
                    <span>Don't have an account?</span>
                    <a href="#">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
